services:
  - type: web
    name: nexora-checksheet
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_PATH
        value: /data/checksheet.db
      - key: JWT_SECRET
        sync: false
    disk:
      name: nexora-data
      mountPath: /data
      sizeGB: 1
